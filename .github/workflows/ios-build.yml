name: iOS build

# iOS 工程编译验证 + 手动触发的未签名 IPA 打包。
# - pull_request 改了 ios/ 时自动跑验证（debug 编译，不出包）；
# - workflow_dispatch 手动触发时额外打一个**未签名 release IPA**（Artifact 名 ios-ipa），
#   下载后用 Sideloadly / AltStore 以个人 Apple ID 签名侧载（免费证书 7 天有效）。
on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-build.yml']

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign

  # 手动触发才打包 IPA（PR 验证不需要产物，省 runner 时间）。
  # 未签名：仓库无私有证书/描述文件；侧载工具（Sideloadly/AltStore/TrollStore）会本地重签。
  ipa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: 打包未签名 IPA（Payload 结构）
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry lyra-ios-unsigned.ipa Payload
          ls -lh lyra-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: lyra-ios-unsigned.ipa
          retention-days: 14
