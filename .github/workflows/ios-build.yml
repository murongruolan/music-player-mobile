name: iOS build

# 只验证 iOS 工程能编译（Swift 原生代码：画中画歌词、桌面图标），不签名、不出包。
# 改了 ios/ 时自动跑，也可以手动触发。
on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-build.yml']

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
