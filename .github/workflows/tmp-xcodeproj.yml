# 一次性：在 ubuntu 上用 xcodeproj gem 生成 LyraWidget target，提交 project.pbxproj。用完即删。
name: tmp xcodeproj
on:
  push:
    branches: [feat/live-activity]
    paths: ['.github/tmp/add_widget_target.rb']
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install xcodeproj --no-document
      - run: ruby .github/tmp/add_widget_target.rb
      - run: git diff --stat
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner.xcodeproj/project.pbxproj
          git commit -m "build(ios): add LyraWidget extension target"
          git push
