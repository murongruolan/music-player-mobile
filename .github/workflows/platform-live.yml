name: Platform live smoke

# 真实请求各音乐平台的公开接口（搜索 / 联想 / 热搜 / 歌单广场 / 排行榜 / 详情 / 歌词），看海外 runner 上哪些能通。
# 手动触发；结果在日志和 live-log 产物里。
on:
  workflow_dispatch:
  push:
    branches: ['feat/platform-content']
    paths: ['lib/platform/**', 'test/live/**', '.github/workflows/platform-live.yml']

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Live
        run: |
          set -o pipefail
          LIVE=1 flutter test test/live --reporter expanded 2>&1 | tee live.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-log
          path: live.txt
          retention-days: 14
