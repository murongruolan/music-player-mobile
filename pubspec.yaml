name: lyra
description: Lyra（暂名）移动端 · Flutter 实现（mock 数据版）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # 网络请求：官方包，支持 Web，自带 MockClient 便于测试
  http: ^1.2.2
  # 令牌 / 设备 ID 存系统钥匙串（iOS Keychain、Android Keystore 加密）
  flutter_secure_storage: ^11.2.0
  # 非敏感的本地数据（公告已读、同步版本号、听歌统计、埋点队列）；钥匙串不适合放大块数据
  shared_preferences: ^2.3.0
  # 打开更新包下载地址 / 外部链接（官方插件）
  url_launcher: ^6.3.0
  # 扫码登录：扫电视 / 车机 / 桌面端上的授权二维码
  mobile_scanner: ^7.0.0
  # 播放引擎：Android 走 Media3/ExoPlayer，iOS 走 AVPlayer，Web 有官方实现。
  # Flutter SDK 本身没有媒体播放能力，这是平台播放器的标准封装。
  just_audio: ^0.10.6
  # 媒体会话 / 通知栏媒体通知（播放/暂停/上下曲/自定义收藏操作），后台播放。
  audio_service: ^0.18.19
  # 音频焦点：来电、其他 App 播放时正确暂停与恢复。
  audio_session: ^0.2.4
  # 平台接口签名 / 加密（网易 weapi·eapi、QQ zzcSign、酷狗签名、酷我 AES）与歌词解码（酷狗 KRC zlib）
  crypto: ^3.0.3
  pointycastle: ^4.0.0
  archive: ^4.0.0
  # 公告 Markdown 解析（官方 dart-lang/markdown，渲染自己做）
  markdown: ^7.2.0
  # 洛雪音源脚本运行时：QuickJS（quickjs-ng）的 dart:ffi 绑定，构建时由 Dart build hooks 从 C 源码编译，
  # Android / iOS / 桌面（含 flutter test 的宿主机）都能跑。
  # 0.4.0（改用 build hooks 的版本）还没发布到 pub.dev，且 quickjs-ng 是 git 子模块（pub 的 git 依赖不拉子模块），
  # 所以连同 quickjs-ng 源码放在 third_party/flutter_qjs（MIT，见其中 LICENSE / README_LYRA.md）
  flutter_qjs:
    path: third_party/flutter_qjs
  # 从文件导入音源脚本（flutter.dev 官方插件，系统文件选择器）
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
