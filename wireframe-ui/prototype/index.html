<!doctype html>
<!--
  Lyra（暂名）Mobile · 全量 UI 高保真原型 v4（零依赖，双击打开）
  - 左侧目录可跳到任意页面 / 状态；「总览全部页面」把所有状态平铺成缩略图
  - 手机浏览器打开会自动全屏，可当真 App 操作
  - URL 参数：?go=页面名  ?view=board  ?theme=light  ?accent=0..5  ?bar=island|glass|solid
  - 结构：css/tokens.css（设计令牌） css/app.css（组件） css/player.css（播放器皮肤）
          js/core.js（状态/路由/交互） js/pages.js js/settings.js js/player.js js/fx.js js/main.js
-->
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0A0B11">
<title>Lyra Mobile · UI 原型</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/features.css">
<link rel="stylesheet" href="css/v4.css">
<link rel="stylesheet" href="css/cloud.css">
<link rel="stylesheet" href="css/complete.css">
<link rel="stylesheet" href="css/auth.css">
<style>
  .bh{font:600 13px var(--font);color:#F4D28A;margin:26px 0 12px;letter-spacing:.04em}
  .bh:first-child{margin-top:0}
  .bgrid{display:flex;flex-wrap:wrap;gap:22px 18px}
  .bcell{width:195px;cursor:pointer}
  .bcell .phone{transform:scale(.5);transform-origin:0 0;margin-bottom:-422px;pointer-events:none}
  .bcell .bn-l{margin-top:432px;font-size:12px;color:#a6abbb;text-align:center}
  .bcell:hover .bn-l{color:#fff}
  .bcell.wide{width:422px}.bcell.wide .phone{margin-bottom:-195px}.bcell.wide .bn-l{margin-top:205px}
</style>
</head>
<body>
<div class="desk">
  <aside class="side" id="side"></aside>
  <main class="stage">
    <div class="phone" id="phone"><div class="notch"></div><div class="screen" id="screen"></div><div class="toast" id="toast"></div><div class="homebar"></div></div>
  </main>
</div>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/pages.js"></script>
<script src="js/settings.js"></script>
<script src="js/player.js"></script>
<script src="js/features.js"></script>
<script src="js/v4.js"></script>
<script src="js/cloud.js"></script>
<script src="js/complete.js"></script>
<script src="js/v44.js"></script>
<script src="js/auth.js"></script>
<script src="js/fx.js"></script>
<script src="js/main.js"></script>
</body>
</html>
